<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Documents hub icon. A minimal, full-colour Fluent glyph with a
    *distinctive silhouette* — like ADO's own hub icons (Pipelines' rocket,
    Test Plans' flask, Artifacts' boxes), the outline alone should read, not a
    generic tile.

    The silhouette is two stacked sheets: a back page peeking up-and-right
    behind a dog-eared front page. That offset-stack shape says "documents"
    (a collection / hub) at a glance — elegant and feature-neutral, rather
    than leaning on any one capability.

    Composition (back to front):
      1. A lighter azure back sheet, offset up-right, with a folded corner.
      2. The gradient azure front sheet, with a folded top-right corner.
      3. White text lines (interior detail, like the native glyphs carry).

    Theme-agnostic: the vivid glyph stays legible on light and dark chrome,
    so the light and dark variants are identical.
  -->
  <defs>
    <linearGradient id="docFront" x1="6.7" y1="4.4" x2="6.7" y2="13.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5db8ff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <linearGradient id="docBack" x1="7.9" y1="3.0" x2="7.9" y2="12.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="1" stop-color="#7fb0f0"/>
    </linearGradient>
  </defs>
  <!--
    Scale the whole glyph up about its centre so it fills the 16px box like
    the native hub icons (the unscaled art sat noticeably smaller). The
    transform also thickens the strokes proportionally, giving the lines the
    same visual weight the sibling glyphs carry.
  -->
  <g transform="translate(8 8) scale(1.28) translate(-7.3 -8.4)">
    <!-- Back sheet (offset up-right), with folded corner. -->
    <path d="M4.2 4.0A1 1 0 0 1 5.2 3.0H9.6L11.6 5.0V11.4A1 1 0 0 1 10.6 12.4H5.2A1 1 0 0 1 4.2 11.4Z" fill="url(#docBack)"/>
    <path d="M9.6 3.0V4.5A0.5 0.5 0 0 0 10.1 5.0H11.6Z" fill="#cfe6ff"/>
    <!-- Front sheet, with folded top-right corner. -->
    <path d="M3.0 5.4A1 1 0 0 1 4.0 4.4H8.4L10.4 6.4V12.8A1 1 0 0 1 9.4 13.8H4.0A1 1 0 0 1 3.0 12.8Z" fill="url(#docFront)"/>
    <path d="M8.4 4.4V5.9A0.5 0.5 0 0 0 8.9 6.4H10.4Z" fill="#bcd9ff"/>
    <!-- Front-sheet text lines. -->
    <path d="M4.4 8.2H9.0" stroke="#ffffff" stroke-width="1.0" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M4.4 9.9H9.0" stroke="#ffffff" stroke-width="1.0" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M4.4 11.6H6.8" stroke="#ffffff" stroke-width="1.0" stroke-linecap="round" stroke-opacity="0.95"/>
  </g>
</svg>
