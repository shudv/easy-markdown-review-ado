<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Easy Markdown Review">
  <defs>
    <!-- Subtle page depth: white top → faint blue bottom. -->
    <linearGradient id="emr-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#ECF4FC" />
    </linearGradient>
    <!-- Comment-bubble body gradient (bright azure → deeper azure). -->
    <linearGradient id="emr-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A9DF4" />
      <stop offset="1" stop-color="#0A6CC9" />
    </linearGradient>
    <!-- Reviewed-line highlight (amber). -->
    <linearGradient id="emr-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC838" />
      <stop offset="1" stop-color="#FCA800" />
    </linearGradient>
    <!-- Soft lift so the page + bubble sit above the surface. -->
    <filter id="emr-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B3D73" flood-opacity="0.20" />
    </filter>
  </defs>

  <!-- Document page (folded top-right corner). -->
  <g filter="url(#emr-shadow)">
    <path
      d="M40,40 Q40,28 52,28 L140,28 L172,60 L172,204 Q172,216 160,216 L52,216 Q40,216 40,204 Z"
      fill="url(#emr-page)" stroke="#0078D4" stroke-width="7" stroke-linejoin="round" />
  </g>

  <!-- Folded corner flap. -->
  <path d="M140,28 L172,60 L140,60 Z" fill="#CFE6FB" stroke="#0078D4" stroke-width="7"
    stroke-linejoin="round" />

  <!-- Body text lines. -->
  <g fill="#C6CDD6">
    <rect x="62" y="70" width="88" height="9" rx="4.5" />
    <rect x="62" y="92" width="88" height="9" rx="4.5" />
    <rect x="62" y="136" width="88" height="9" rx="4.5" />
    <rect x="62" y="158" width="88" height="9" rx="4.5" />
    <rect x="62" y="180" width="52" height="9" rx="4.5" />
  </g>

  <!-- Highlighted (under-review) line. -->
  <rect x="56" y="110" width="100" height="15" rx="7.5" fill="url(#emr-amber)" stroke="#E79A00"
    stroke-width="2" />

  <!-- Comment bubble: white halo separates it from the page, then the azure disc. -->
  <circle cx="189" cy="190" r="45" fill="#FFFFFF" />
  <g filter="url(#emr-shadow)">
    <circle cx="189" cy="190" r="38" fill="url(#emr-blue)" />
  </g>
  <g fill="#FFFFFF">
    <circle cx="173" cy="190" r="5.5" />
    <circle cx="189" cy="190" r="5.5" />
    <circle cx="205" cy="190" r="5.5" />
  </g>
</svg>
