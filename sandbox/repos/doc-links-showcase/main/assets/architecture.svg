<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" role="img" aria-label="Architecture diagram">
  <rect width="420" height="160" fill="#f6f8fa" />
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="20" y="55" width="110" height="50" rx="8" />
    <rect x="165" y="55" width="90" height="50" rx="8" />
    <rect x="290" y="55" width="110" height="50" rx="8" />
  </g>
  <g fill="#1f2328" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="75" y="85">Reader</text>
    <text x="210" y="85">Router</text>
    <text x="345" y="85">Target</text>
  </g>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)">
    <line x1="130" y1="80" x2="163" y2="80" />
